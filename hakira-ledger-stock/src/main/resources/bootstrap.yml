#Nacos 配置中心
spring:
  application:
    name: hakira-ledger-stock
  profiles:
    default: local
  cloud:
    nacos:
      discovery:
        server-addr: ${hakira.nacos.host}
        username: ${hakira.nacos.username}
        password: ${hakira.nacos.password}
        namespace: public
        ephemeral: true
      config:
        server-addr: ${hakira.nacos.host}
        file-extension: yaml
        namespace: public
        group: DEFAULT-GROUP
