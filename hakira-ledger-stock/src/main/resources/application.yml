server:
  port: 8002
  servlet:
    context-path: /ledger-stock
spring:
  application:
    name: hakira-ledger-stock-service
  profiles:
    default: local
  datasource:
    url: jdbc:mysql://${hakira.db.host}/hakira
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${hakira.db.username}
    password: ${hakira.db.password}
  cloud:
    nacos:
      server-addr: ${hakira.nacos.host}
      discovery:
        username: ${hakira.nacos.username}
        password: ${hakira.nacos.password}
        namespace: public
        ephemeral: true #nacos注册服务提供方设置为非临时实例
#消费者微服务名称（Nacos服务名）
service-url:
  nacos-user-service: http://hakira-ledger-entry-service
#日志监控的指定接口输出级别设置
logging:
  level:
    com.hakira.market.api.order.StockTestService: debug
# 激活Sentinel对OpenFeign的支持
feign:
  sentinel:
    enabled: true
# rocketmq配置
rocketmq:
  name-server: localhost:9876
  producer:
    group: hakira-ledger-stock-producer
  consumer:
    group: hakira-ledger-stock-consumer
management:
  endpoint:
    web:
      exposure:
        include: '*'