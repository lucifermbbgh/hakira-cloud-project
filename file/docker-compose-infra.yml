# ============================================================
# hakira-cloud-project 基础设施部署
# MySQL (账本专用) + Nacos (注册中心/配置中心，内置存储)
# ============================================================
version: "3.8"

services:
  # ==================== MySQL ====================
  hakira_ledger_mysql:
    image: mysql:8.0
    container_name: hakira_ledger_mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Shanghai
      LANG: C.UTF-8
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - hakira_ledger_mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    networks:
      - hakira_ledger_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ==================== Nacos ====================
  hakira_ledger_nacos:
    image: nacos/nacos-server:v3.2.3
    container_name: hakira_ledger_nacos
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      NACOS_AUTH_TOKEN: "U2VjcmV0S2V5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5"
      NACOS_AUTH_IDENTITY_KEY: "serverIdentity"
      NACOS_AUTH_IDENTITY_VALUE: "security"
    networks:
      - hakira_ledger_net
    restart: unless-stopped

networks:
  hakira_ledger_net:
    name: hakira_ledger_net

volumes:
  hakira_ledger_mysql_data:
    name: hakira_ledger_mysql_data
