server:
  port: 8001
  servlet:
    context-path: /ledger-entry
spring:
  application:
    name: hakira-ledger-entry-service
  profiles:
    default: local
  datasource:
    url: jdbc:mysql://${hakira.db.host}/hakira
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${hakira.db.username}
    password: ${hakira.db.password}
  cloud:
    nacos:
      server-addr: ${hakira.nacos.host}
      discovery:
        username: ${hakira.nacos.username}
        password: ${hakira.nacos.password}
        namespace: public
        ephemeral: true #nacos注册服务提供方设置为非临时实例
    sentinel:
      transport:
        dashboard: localhost:8080 #配置Sentinel dashboard地址
        port: 8719 #默认8719端口，检测被占用会自动在默认端口上+1（8719+1=8720），直至找到未被占用的端口为止
      web-context-unify: false #配置为false即可根据不同的URL进行链路限流，如果不配置将不会生效
      flow:
        coldFactor: 3
#消费者微服务名称（Nacos服务名）
service-url:
  nacos-user-service: http://hakira-ledger-stock-service
#日志监控的指定接口输出级别设置
logging:
  level:
    com.hakira.market.api.order.StockTestService: debug
# 激活Sentinel对OpenFeign的支持
feign:
  sentinel:
    enabled: true
# 激活Sentinel对RestTemplate的支持
resttemplate:
  sentinel:
    enabled: true
# rocketmq配置
rocketmq:
  name-server: localhost:9876
  producer:
    group: hakira-ledger-entry-producer
  consumer:
    group: hakira-ledger-entry-consumer
management:
  endpoint:
    web:
      exposure:
        include: '*'
