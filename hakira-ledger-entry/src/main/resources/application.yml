server:
  port: 9020
spring:
  application:
    name: hakira-ledger-entry
  profiles:
    default: local
  datasource:
    url: jdbc:mysql://${hakira.db.host}/hakira_ledger?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${hakira.db.username}
    password: ${hakira.db.password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  cloud:
    nacos:
      server-addr: ${hakira.nacos.host}
      discovery:
        username: ${hakira.nacos.username}
        password: ${hakira.nacos.password}
        namespace: public
        ephemeral: true #nacos注册服务提供方设置为非临时实例
    sentinel:
      transport:
        dashboard: localhost:8080 #配置Sentinel dashboard地址
        port: 8719 #默认8719端口，检测被占用会自动在默认端口上+1
      web-context-unify: false
      flow:
        coldFactor: 3
#日志监控的指定接口输出级别设置
logging:
  level:
    com.hakira.ledger.api.entry: debug
    com.hakira.ledger.api.stock: debug
# 激活Sentinel对OpenFeign的支持
feign:
  sentinel:
    enabled: true
management:
  endpoint:
    web:
      exposure:
        include: '*'

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
